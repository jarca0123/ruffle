[package]
name = "ruffle_avm2_jit"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
ruffle_core = { path = "../core" }
# Runtime WASM module emission. On the web the emitted module is compiled by the
# browser's engine (`WebAssembly.Module`); natively it is validated / run through
# a WASM interpreter for testing.
wasm-encoder = "0.221"
tracing = { workspace = true }
# Pointer-/id-keyed hot maps (the per-call method-cache/instance lookups): FNV
# beats the DoS-resistant SipHash default, which showed in gameplay profiles.
fnv = { workspace = true }

# Native execution of the emitted module (desktop path + JIT↔interpreter tests):
# wasmtime compiles it to real machine code via cranelift — the emitted-module
# pipeline is shared with the web (where the browser's engine does the same job).
# wasmi (a WASM interpreter, ~40x slower on exception-heavy content) remains only
# for the in-crate lowering unit tests, which exercise emitted-code semantics.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmtime = { version = "46", default-features = false, features = ["cranelift", "runtime"] }
wasmi = "0.40"

# On the web the runner drives the browser's `WebAssembly` engine directly.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }

[dev-dependencies]
# Run the Rust-level JIT tests in a real browser (where `WebAssembly.Module` from
# generated bytes is available), via `wasm-pack test --headless --firefox`.
# Loose minor: let the resolver pick the wasm-bindgen-test whose pinned
# `wasm-bindgen` matches the workspace one.
wasm-bindgen-test = "0.3"
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
# End-to-end differential test: hand-assemble an AVM2 SWF and run it through a
# real headless Player, self-checking the JIT against the interpreter.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
swf = { path = "../swf" }

# Only to compile the wasm32 test graph standalone: ruffle_core pulls in
# getrandom, whose `wasm_js` backend feature is normally enabled by the `web`
# crate. (The real web build gets it there; this just lets us check the runner.)
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
