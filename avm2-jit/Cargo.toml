[package]
name = "ruffle_avm2_jit"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
ruffle_core = { path = "../core" }
# Runtime WASM module emission. On the web the emitted module is compiled by the
# browser's engine (`WebAssembly.Module`); natively it is validated / run through
# a WASM interpreter for testing.
wasm-encoder = "0.221"
tracing = { workspace = true }

# Native execution of the emitted module (desktop path + JIT↔interpreter tests).
# On the web the browser's own engine runs the module instead, so wasmi is only
# pulled in off-wasm.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmi = "0.40"

[dev-dependencies]
# Run the Rust-level JIT tests in a real browser (where `WebAssembly.Module` from
# generated bytes is available), via `wasm-pack test --headless --firefox`.
# Loose minor: let the resolver pick the wasm-bindgen-test whose pinned
# `wasm-bindgen` matches the workspace one.
wasm-bindgen-test = "0.3"
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
# End-to-end differential test: hand-assemble an AVM2 SWF and run it through a
# real headless Player, self-checking the JIT against the interpreter.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
swf = { path = "../swf" }
